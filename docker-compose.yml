services:

  app1:
    build: .
    image: sentinelstack:latest
    container_name: sentinelstack-app1
    user: "10501:10501"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    volumes:
      - app-data:/var/www/html/data
      - ./.env:/var/www/html/.env:ro
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  app2:
    build: .
    image: sentinelstack:latest
    container_name: sentinelstack-app2
    user: "10501:10501"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    volumes:
      - app-data:/var/www/html/data
      - ./.env:/var/www/html/.env:ro
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Runs bin/cron.php every 60 s to fire due reminders and send emails.
  cron:
    build: .
    image: sentinelstack:latest
    container_name: sentinelstack-cron
    user: "10501:10501"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["sh", "-c", "while true; do php /var/www/html/bin/cron.php; sleep 60; done"]
    volumes:
      - app-data:/var/www/html/data
      - ./.env:/var/www/html/.env:ro
    networks:
      - app
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: sentinelstack-nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: sentinelstack-prometheus
    user: "10501:10501"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: sentinelstack-grafana
    user: "10501:10501"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
    restart: unless-stopped

networks:
  app:
  monitoring:

volumes:
  app-data:
  prometheus-data:
  grafana-data:
