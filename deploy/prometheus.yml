global:
  scrape_interval: 15s

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # node_exporter runs on the EC2 host (not in Docker).
  # host.docker.internal resolves to the host from inside a container.
  - job_name: host
    static_configs:
      - targets: ['host.docker.internal:9100']

  # Docker daemon metrics — enable in ~/.config/docker/daemon.json:
  # { "metrics-addr": "127.0.0.1:9323", "experimental": true }
  - job_name: docker
    static_configs:
      - targets: ['host.docker.internal:9323']
