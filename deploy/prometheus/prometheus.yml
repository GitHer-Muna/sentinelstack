global:
  scrape_interval: 15s

# Targets are reached by container name, not by host.docker.internal.
# Under rootless Docker, host.docker.internal:host-gateway routes through
# rootlesskit's userspace network stack and doesn't reliably reach other
# containers' published ports. Putting node-exporter, cadvisor and
# prometheus on the same user-defined bridge network ("monitoring") and
# addressing them by container name sidesteps that entirely.
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
