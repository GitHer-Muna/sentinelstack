name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: php -l
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, json
          coverage: none

      - name: Lint every PHP file
        run: |
          err=0
          for f in $(find src templates public database config -type f -name '*.php'); do
            if ! php -l "$f" 2>&1 | grep -q 'No syntax errors'; then
              err=$((err + 1))
              echo "FAIL $f"
              php -l "$f"
            fi
          done
          echo "php-lint errors: $err"
          test "$err" -eq 0
