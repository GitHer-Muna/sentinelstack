name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Test both the lowest supported version and the current LTS so a
      # stray 8.1+ syntax in a file doesn't silently break PHP 8.0 users.
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.3']
        # Job-level `name:` does NOT interpolate matrix variables, so the
        # UI would otherwise show the raw `${{ matrix.php-version }}`
        # string. The `include` key gives each matrix entry a friendly
        # name that actually renders.
        include:
          - php-version: '8.0'
            name: 'php -l (PHP 8.0)'
          - php-version: '8.3'
            name: 'php -l (PHP 8.3)'
    steps:
      - uses: actions/checkout@v4

      # Cache the vendor dir keyed on composer.lock so warm runs skip
      # the composer download step entirely. Saves ~30s on every CI run
      # after the first.
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php-version }}-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pdo_sqlite, json
          coverage: none

      # composer.lock is committed, so this is fast and exercises
      # composer.json as a smoke test (typo, wrong constraint, missing
      # dep, etc. all fail here instead of at deploy time).
      # --no-interaction guards against a future private-repo dep
      # hanging the job on a credential prompt.
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts --no-interaction

      - name: Lint every PHP file
        run: |
          err=0
          for f in $(find src templates public database config -type f -name '*.php'); do
            if ! php -l "$f" 2>&1 | grep -q 'No syntax errors'; then
              err=$((err + 1))
              echo "FAIL $f"
              php -l "$f"
            fi
          done
          echo "php-lint errors: $err"
          test "$err" -eq 0
